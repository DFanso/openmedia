<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>OpenMedia</title>
    <style>
      /* The splash continues the native launch screen: same colour, same logo, same size and
         place, so nothing changes when the web view takes over. Keep in step with
         LaunchScreen.storyboard and SiteViewPlugin.installBackdrop. */
      html,
      body {
        margin: 0;
        background: #070b14;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #070b14;
        transition:
          opacity 320ms ease,
          transform 320ms ease;
      }
      #splash[data-hidden] {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      /* The logo sits exactly where the launch screen puts it: centred, 52% of the width and at
         most 240 px. Everything else is placed around it, never under it. */
      #splash .mark {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(52vmin, 240px);
        height: min(52vmin, 240px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash svg {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* The halo behind the logo: the one thing that moves while the app starts. */
      #splash .mark::before {
        content: "";
        position: absolute;
        inset: -28%;
        background: radial-gradient(circle, rgb(6 175 248 / 0.2) 0%, transparent 68%);
        opacity: 0;
        animation:
          splash-halo 900ms ease-out forwards,
          splash-breathe 7s ease-in-out 900ms infinite;
      }
      /* The site being opened, in the system monospace: a status line, not a headline. */
      #splash .host {
        position: absolute;
        left: 50%;
        top: calc(50% + min(26vmin, 120px) + 28px);
        transform: translateX(-50%);
        max-width: 80vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font:
          500 12px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.06em;
        color: rgb(238 243 250 / 0.45);
        opacity: 0;
        transition: opacity 400ms ease;
      }
      #splash[data-host] .host {
        opacity: 1;
      }
      /* How far the launch has come: the web view booting, the shell up, the first site drawn. */
      #splash .track {
        position: absolute;
        left: 50%;
        top: calc(50% + min(26vmin, 120px) + 56px);
        transform: translateX(-50%);
        width: min(44vmin, 180px);
        height: 2px;
        border-radius: 2px;
        background: rgb(190 220 255 / 0.16);
        overflow: hidden;
      }
      #splash .fill {
        display: block;
        height: 100%;
        width: 12%;
        border-radius: 2px;
        background: #06aff8;
        box-shadow: 0 0 12px rgb(6 175 248 / 0.5);
        transition: width 800ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #splash[data-stage="shell"] .fill {
        width: 48%;
      }
      #splash[data-stage="done"] .fill {
        width: 100%;
        transition: none;
      }
      @keyframes splash-halo {
        to {
          opacity: 1;
        }
      }
      @keyframes splash-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f4f7fc;
        }
        #splash {
          background: #f4f7fc;
        }
        #splash .mark::before {
          background: radial-gradient(circle, rgb(6 175 248 / 0.14) 0%, transparent 68%);
        }
        #splash .host {
          color: rgb(11 18 32 / 0.45);
        }
        #splash .track {
          background: rgb(11 18 32 / 0.12);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .mark::before {
          animation: splash-halo 900ms ease-out forwards;
        }
        #splash .fill {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash" data-stage="boot">
      <div class="mark">
        <!--logo-mark-->
      </div>
      <p class="host"></p>
      <div class="track"><span class="fill"></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
