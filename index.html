<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>OpenMedia</title>
    <style>
      html,
      body {
        margin: 0;
        background: #070b14;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 45%, #0d1a36 0%, #070b14 65%);
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
      }
      #splash .mark {
        position: relative;
        width: min(52vmin, 240px);
        height: min(52vmin, 240px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash img {
        position: relative;
        width: 100%;
        height: 100%;
        animation:
          splash-pop 0.8s cubic-bezier(0.22, 1.5, 0.36, 1) both,
          splash-float 2.4s ease-in-out 0.8s infinite;
      }
      #splash .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid #06aff8;
        opacity: 0;
        animation: splash-ring 2s ease-out 0.5s infinite;
      }
      #splash .ring:nth-child(2) {
        animation-delay: 1.2s;
      }
      #splash[data-hidden] {
        opacity: 0;
        transform: scale(1.08);
        pointer-events: none;
      }
      @keyframes splash-pop {
        from {
          opacity: 0;
          transform: scale(0.4) rotate(-12deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-float {
        50% {
          transform: translateY(-8px) scale(1.04);
        }
      }
      @keyframes splash-ring {
        from {
          opacity: 0.55;
          transform: scale(0.7);
        }
        to {
          opacity: 0;
          transform: scale(1.7);
        }
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f4f7fc;
        }
        #splash {
          background: radial-gradient(circle at 50% 45%, #ffffff 0%, #f4f7fc 65%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img,
        #splash .ring {
          animation: none;
        }
        #splash .ring {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash">
      <div class="mark">
        <span class="ring"></span><span class="ring"></span>
        <img src="/logo-mark.svg" alt="" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
