<!doctype html>
<!-- Structure observed on www.messenger.com/login/ with a desktop UA, logged out, 2026-11-08; text, ids and links are placeholders. data-keep marks what no rule may hide. -->
<html lang="en">
  <body>
    <div id="XMessengerDotComLoginViewPlaceholder" data-keep>
      <h2>Connect with your favourite people</h2>
      <form id="login_form" action="/login/password/" method="post" data-keep>
        <div id="loginform">
          <input type="text" id="email" name="email" placeholder="Email address or phone number">
          <input type="password" id="pass" name="pass" placeholder="Password">
          <button id="loginbutton" type="submit">Continue</button>
          <label><input type="checkbox" name="persistent"> Keep me signed in</label>
        </div>
      </form>
      <div>
        <a href="https://www.facebook.com/r.php">Not on Facebook?</a>
        <span>|</span>
        <div role="button"><span>Forgotten password</span></div>
        <span>|</span>
        <a href="https://www.facebook.com/privacy/policy/">Privacy Policy</a>
      </div>
    </div>
  </body>
</html>
