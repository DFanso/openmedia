<!doctype html>
<html lang="zh-CN"><body>
<div id="app">
  <div class="lite-page-wrap">
    <div class="lite-topbar lite-page-top" data-keep>
      <div class="nav-left"><i class="m-font m-font-arrow-left"></i></div>
      <div class="nav-main">Post</div>
      <div class="nav-right"><i class="m-font m-font-dot-more"></i></div>
    </div>
    <div class="main" data-keep>
      <div class="card m-panel card9 f-weibo"><div class="card-wrap">
        <header class="weibo-top m-box">
          <div class="m-avatar-box m-box-center"><a class="m-img-box"><img alt=""></a></div>
          <div class="m-box-dir m-box-col m-box-center"><div class="m-text-box"><h3 class="m-text-cut">Example user</h3></div></div>
          <div callback="follow()" class="m-add-box m-followBtn"><span class="m-add-box"><i class="m-font m-font-plus"></i><h4>Follow</h4></span></div>
        </header>
        <article class="weibo-main"><div class="card-wrap">
          <div class="weibo-og"><div class="weibo-text">Example post text</div></div>
          <div class="weibo-media f-media"><div class="weibo-media-wraps"><div class="card-video type-video"><div class="mwb-video mwbv-play mwbv-info"></div></div></div></div>
        </div></article>
      </div></div>
      <div class="ad-wrap" style="display: none;"></div>
      <div>
        <div class="lite-page-tab">
          <div class="tab-item"><i>Reposts<em></em></i><i>100</i></div>
          <div class="tab-item cur"><i>Comments<em></em></i><i>9582</i></div>
          <div class="tab-item"><i>Likes<em></em></i><i>466</i></div>
        </div>
        <div class="comment-content">
          <div><div class="card m-avatar-box lite-page-list"><div class="card-wrap"><div class="card-main"><div class="m-box"><div class="m-img-box"><img alt=""></div><div class="m-box-col m-box-dir m-box-center lite-line">Example comment</div></div></div></div></div></div>
        </div>
      </div>
    </div>
    <div class="lite-page-editor"><div class="editor-input">Write a comment</div></div>
  </div>
</div>
</body></html>
