<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Discord fixture: login (390px, logged out)</title></head>
<body>
<div id="app-mount">
  <div class="mobileApp">
    <div class="wrapper">
      <form class="authBoxExpanded authBox" data-keep>
        <h1>Welcome back!</h1>
        <label>Email or Phone Number <input type="text" name="email"></label>
        <label>Password <input type="password" name="password"></label>
        <a href="#">Forgot your password?</a>
        <button type="submit">Log In</button>
        <a href="#">Or sign in with a passkey</a>
        <div>Need an account? <a href="/register">Register</a></div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
