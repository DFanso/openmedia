<!doctype html>
<!-- Structure observed on www.threads.com with an iPhone UA, logged out, 2026-11-07; text, ids and links are placeholders. data-keep marks what no rule may hide. -->

    <div>
      <div>
        <div>
          <div id="barcelona-header">

              </div>
            </div>
            <div>

          </div>
          <div></div>
          <div>
            <div aria-hidden="true" id="scrollview" data-keep>

                <div>
                  <div>

                        </div>
                      </div>

                          </div>
                        </div>
                      </div>

                        <div>
                          <div data-pressable-container="true" data-interactive-id="">

                            </div>
                          </div>
                        </div>
                      </div>

                </div>

            </div>
          </div>
        </div>
        <nav data-keep>

            <a href="/search" role="link" tabindex="0"><div><svg role="img"></svg></div></a>

          <div>
            <div role="button" tabindex="0"><div><svg role="img"></svg></div></div>
