<!doctype html>
<html><body>
<div id="root">
<div><header id="twilight-sticky-header-root"></header></div>
<main id="page-main-content-wrapper" aria-label="Main Content" data-keep>
<div>
<div>
<button aria-label="Open channel metadata for examplechannel"></button>
<button aria-label="Follow examplechannel" data-a-target="follow-button" data-test-selector="follow-button"><div data-a-target="tw-core-button-label-text"></div></button>
<button aria-label="Subscribe"><div data-a-target="tw-core-button-label-text"></div></button>
</div>
<div data-a-target="video-player" data-keep>
<div data-test-selector="sda-wrapper"><div data-test-selector="sda-container"></div></div>
<video aria-label="Twitch video player"></video>
<section id="channel-player" aria-label="Player Controls"><button aria-label="Pause (space/k)" data-a-target="player-play-pause-button"></button></section>
</div>
<div>
<div data-a-target="chat-scroller"><div role="log" data-test-selector="chat-scrollable-area__message-container"><div role="group" aria-label="viewer1: hello" data-a-target="chat-line-message" data-a-user="viewer1"><span data-a-target="chat-message-username">viewer1</span><span data-a-target="chat-message-text">hello</span></div></div></div>
<div data-keep><button><div style="white-space: nowrap;">Send Chat</div></button></div>
</div>
</div>
</main>
</div>
</body></html>
