<!doctype html>
<html lang="en">
<body>
<div id="root">
  <div id="douyin-mobile-header" data-keep>
    <header>
      <div><svg width="60" height="24"></svg></div>
      <div>
        <div><span role="img"></span></div>
        <div data-keep><div>Log in</div></div>
        <div><div>Get APP</div></div>
      </div>
    </header>
  </div>
  <div>
    <div class="parent-route-container route-scroll-container">
      <div id="slidelist" class="slidelist" data-active="true" data-keep>
        <div id="douyin-web-recommend-guide-mask" data-e2e="recommend-guide-mask">
          <div><span>Placeholder guide line one</span><span>Placeholder guide line two</span><button type="button">OK</button></div>
        </div>
        <div data-e2e="slideList" data-active="true" data-keep>
          <div>
            <div class="dySwiperSlide" data-e2e="feed-item" slot="inside" data-keep>
              <div data-e2e="feed-active-video" id="sliderVideo" data-keep>
                <div class="playerContainer">
                  <div class="slider-video">
                    <div class="basePlayerContainer xgplayer">
                      <xg-controls class="xgplayer-controls">
                        <xg-inner-controls>
                          <xg-left-grid>
                            <xg-icon class="xgplayer-play"></xg-icon>
                            <xg-icon class="xgplayer-time"><span class="time-current">00:10</span></xg-icon>
                            <div class="chapterContainer" data-e2e="chapter-container"><span>Chapters</span></div>
                          </xg-left-grid>
                          <xg-right-grid>
                            <xg-icon class="xgplayer-volume"></xg-icon>
                          </xg-right-grid>
                        </xg-inner-controls>
                      </xg-controls>
                      <div>
                        <div>
                          <div class="immersive-player-switch-on-hide-interaction-area">
                            <div tabindex="0">
                              <div class="ai-douyin-entry"><div></div></div>
                            </div>
                            <div>
                              <div tabindex="0">
                                <div>
                                  <a href="//www.douyin.com/user/PLACEHOLDER" data-e2e="video-avatar" target="_blank" rel="noopener noreferrer"><span class="semi-avatar" data-e2e="live-avatar" role="listitem"></span></a>
                                  <div data-e2e="feed-follow-icon" tabindex="0"><div><span role="img"></span></div></div>
                                </div>
                              </div>
                              <div tabindex="0"><div data-e2e="video-player-digg"><span role="img"></span><div>0</div></div></div>
                              <div tabindex="0"><div data-e2e="feed-comment-icon"><span role="img"></span><div>0</div></div></div>
                              <div><div data-e2e="video-player-share"><span role="img"></span><div>0</div></div></div>
                            </div>
                            <div class="disturb-login-panel"></div>
                          </div>
                        </div>
                      </div>
                      <div class="player-position-box-bottom">
                        <div class="xgplayer-video-info-wrap" id="video-info-wrap">
                          <div class="video-info-detail" data-e2e="video-info">
                            <div>
                              <div class="account">
                                <div class="account-name" data-e2e="feed-video-nickname"><span>Placeholder author</span></div>
                                <div class="video-create-time"><span class="time">1 Jan</span></div>
                              </div>
                              <div class="title" data-e2e="video-desc"><span>Placeholder caption <a href="//www.douyin.com/search/placeholder">#tag</a></span></div>
                            </div>
                          </div>
                        </div>
                      </div>
                      <xg-video-container class="xg-video-container" data-keep>
                        <video autoplay playsinline></video>
                      </xg-video-container>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="dySwiperSlide" data-e2e="feed-item" slot="inside" data-keep></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="hideInMiniWindow"></div>
  <div id="videoSideCard"></div>
  <div id="chapterVideoSideCard">
    <div id="chapterVideoCard"><div><span>Chapter heading</span><p>Placeholder chapter summary.</p></div></div>
  </div>
  <div id="videoSideBar"></div>
</div>
</body>
</html>
