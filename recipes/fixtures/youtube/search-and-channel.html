<!doctype html>
<!-- m.youtube.com search results and a channel tab strip with an iPhone UA, logged out, 2026-11-07; titles removed. data-keep marks what no rule may hide. -->
<html><body>
<ytm-app data-keep>
  <ytm-search data-keep>
    <ytm-item-section-renderer data-keep>
      <lazy-list data-keep>
        <ytm-video-with-context-renderer data-keep><a href="/watch?v=abc">video</a></ytm-video-with-context-renderer>
        <ytm-video-with-context-renderer><a href="/shorts/abc">short</a></ytm-video-with-context-renderer>
        <grid-shelf-view-model><ytm-shorts-lockup-view-model></ytm-shorts-lockup-view-model></grid-shelf-view-model>
      </lazy-list>
    </ytm-item-section-renderer>
  </ytm-search>
  <yt-tab-shape tab-title="Videos" data-keep></yt-tab-shape>
  <yt-tab-shape tab-title="Shorts"></yt-tab-shape>
</ytm-app>
</body></html>
