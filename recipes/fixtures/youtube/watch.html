<!doctype html>
<!-- m.youtube.com watch page with an iPhone UA, logged out, 2026-11-07; titles removed. data-keep marks what no rule may hide. -->
<html><body>
<ytm-app data-keep>
  <ytm-watch data-keep>
    <div id="player" data-keep><div id="movie_player" data-keep></div></div>
    <ytm-item-section-renderer>
      <lazy-list><yt-video-metadata-carousel-view-model aria-label="Comments"></yt-video-metadata-carousel-view-model></lazy-list>
    </ytm-item-section-renderer>
    <ytm-item-section-renderer data-keep>
      <lazy-list><yt-video-metadata-carousel-view-model aria-label="Description" data-keep></yt-video-metadata-carousel-view-model></lazy-list>
    </ytm-item-section-renderer>
    <div class="related-items-container">
      <ytm-item-section-renderer><ytm-reel-shelf-renderer></ytm-reel-shelf-renderer></ytm-item-section-renderer>
      <ytm-item-section-renderer>
        <ytm-video-with-context-renderer></ytm-video-with-context-renderer>
        <ytm-compact-playlist-renderer></ytm-compact-playlist-renderer>
        <ytm-compact-radio-renderer></ytm-compact-radio-renderer>
      </ytm-item-section-renderer>
    </div>
    <ytm-companion-slot></ytm-companion-slot>
  </ytm-watch>
</ytm-app>
</body></html>
