<!doctype html>

    <div id="__PWS_ROOT__">
      <div data-test-id="unauth-header" data-keep>

      </div>
      <div data-test-id="footer" data-keep><a href="/search/"><div data-test-id="nav-bar-magnifying-glass"></div></a></div>

</html>
