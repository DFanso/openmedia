<!doctype html>
<!-- Structure observed on a pin page on www.pinterest.com, iPhone UA, logged out, 2026-11-08; text and links are placeholders. -->
<html lang="en">
  <body>
    <div id="__PWS_ROOT__">
      <div data-test-id="unauth-header" data-keep><div data-test-id="login-button"><button>Log in</button></div></div>
      <div data-test-id="CloseupMainPin" data-keep>
        <div data-test-id="closeup-container" data-keep>
          <img data-test-id="pin-closeup-image" alt="Pin" src="x.jpg">
          <div><div><div data-test-id="more-like-this-button">More to explore</div></div></div>
        </div>
        <div data-test-id="CloseupDetails" data-keep>
          <div data-test-id="official-user-attribution"><div data-test-id="creator-profile-name">Author</div><div data-test-id="follower-count">1k</div></div>
          <div data-test-id="pinTitle">Title</div>
        </div>
        <div data-test-id="pin-action-bar-container" data-keep>
          <div data-test-id="comment-button"></div>
          <div data-test-id="visit-button-mobile" data-keep>Visit</div>
          <div data-test-id="standard-save-button" data-keep>Save</div>
        </div>
      </div>
      <div data-test-id="related-pins-without-drawer">
        <div data-test-id="related-pins-header">More to explore</div>
        <span><div data-test-id="relatedPins"><div data-test-id="gated-pin-rep"><img alt="Pin" src="y.jpg"></div></div></span>
      </div>
      <div data-test-id="footer" data-keep></div>
      <div role="dialog" style="height: 100%">
        <div data-test-id="mobile-modal-mask-overlay" role="button"><div></div></div>
        <div data-test-id="mobile-signup-mask">
          <div data-test-id="app-install-button"><a>Get Pinterest app</a></div>
          <div data-test-id="LoginButtonsContainer"><button data-test-id="continue-email-button">Continue with email</button></div>
        </div>
      </div>
    </div>
  </body>
</html>
