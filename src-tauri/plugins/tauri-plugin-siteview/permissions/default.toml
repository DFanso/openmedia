[default]
description = "Shell-only control of the native site view. `open` is deliberately absent: the app's own `open_site` command opens pages so it can attach the recipe script. Never grant to a site webview."
permissions = [
  "allow-close",
  "allow-set-rect",
  "allow-set-interactive-regions",
  "allow-navigate",
  "allow-go-back",
  "allow-go-forward",
  "allow-reload",
]
