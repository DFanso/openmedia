# Dependency policy, checked in CI with `cargo deny check`.
# Run locally with `cargo deny --manifest-path src-tauri/Cargo.toml check`.

[graph]
# Only the platforms OpenMedia ships (or is planned for) count: the Linux GTK3 stack Tauri pulls in
# for desktop Linux carries unmaintained-crate advisories that do not reach any shipped binary.
targets = [
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-apple-darwin",
  "aarch64-linux-android",
  "x86_64-pc-windows-msvc",
]

[advisories]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
