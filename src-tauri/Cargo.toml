[package]
name = "openmedia"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openmedia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-siteview = { path = "plugins/tauri-plugin-siteview" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1.13.1"
zeroize = "1.9.1"
keyring = { version = "3", default-features = false, features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2.5.8"
# Brave's filter engine. Only the ABP-syntax parser and the Safari content-blocking converter are
# used; list matching happens in WebKit, not here.
adblock = { version = "0.13.5", default-features = false, features = ["content-blocking", "embedded-domain-resolver"] }
sha2 = "0.10"

[dev-dependencies]
scraper = "0.29.0"
tempfile = "3"


# Line tables only: panics and `sample` still show source lines, but target/ stays a fraction of
# the size (a full debug build of the iOS target filled a laptop disk).
[profile.dev]
debug = "line-tables-only"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
